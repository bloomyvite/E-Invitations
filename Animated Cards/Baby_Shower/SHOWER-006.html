        // ---------- Wait for fonts ----------
        const fontsReady = Promise.all([

            document.fonts.load('italic 300 34px "Cormorant Garamond"'),

            document.fonts.load('300 32px "Cormorant Garamond"'),

        ]);

        // ---------- Globals ----------
        let scene, camera, renderer, controls;
        let card, cardGroup;
        let balloons = [];
        let hearts = [];
        let confetti = [];
        let cardBurst = [];
        let stars;
        let raycaster, mouse;
        let clock;

        const balloonPalette = [

        ];

        const confettiColors = [

        // ---------- Canvas helpers ----------
        function drawHeartCtx(ctx, x, y, size, color) {
            ctx.save();
            ctx.translate(x, y);
            const s = size / 30;
            ctx.scale(s, s);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, 8);
            ctx.bezierCurveTo(0, 8, -8, -2, -14, 4);
            ctx.bezierCurveTo(-22, 12, -14, 22, 0, 30);
            ctx.bezierCurveTo(14, 22, 22, 12, 14, 4);
            ctx.bezierCurveTo(8, -2, 0, 8, 0, 8);
            ctx.fill();
            ctx.restore();
        }

        function drawFlourishCtx(ctx, x, y, w, color) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(x - w, y);
            ctx.bezierCurveTo(x - w * 0.6, y + 6, x - w * 0.2, y - 6, x, y);
            ctx.bezierCurveTo(x + w * 0.2, y - 6, x + w * 0.6, y + 6, x + w, y);
            ctx.stroke();
            ctx.restore();
        }

        function drawCornerOrnament(ctx, cx, cy, rot) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rot);
            ctx.strokeStyle = '#c89b6c';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(0, 50);
            ctx.quadraticCurveTo(0, 0, 50, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(14, 36);
            ctx.quadraticCurveTo(14, 14, 36, 14);
            ctx.stroke();
            drawHeartCtx(ctx, 24, 24, 8, '#c89b6c');
            // small leaves
            ctx.fillStyle = 'rgba(184, 166, 110, 0.5)';
            ctx.beginPath();
            ctx.ellipse(40, 8, 6, 3, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(8, 40, 6, 3, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // ---------- Card front texture ----------
        function createCardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1536;
            const ctx = canvas.getContext('2d');

            // Background gradient
            const grad = ctx.createLinearGradient(0, 0, 0, 1536);
            grad.addColorStop(0, '#fffbf6');
            grad.addColorStop(0.45, '#fff5f8');
            grad.addColorStop(1, '#fdedf2');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1536);

            // Soft sparkle dots
            ctx.fillStyle = 'rgba(212, 165, 116, 0.06)';
            for (let i = 0; i < 320; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 1024, Math.random() * 1536, Math.random() * 2.4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Watercolor wash blobs
            for (let i = 0; i < 8; i++) {
                const gx = Math.random() * 1024;
                const gy = Math.random() * 1536;

                const wg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
                const hue = Math.random() < 0.5 ? '255, 179, 198' : '212, 165, 116';
                wg.addColorStop(0, `rgba(${hue}, 0.10)`);
                wg.addColorStop(1, `rgba(${hue}, 0)`);

                ctx.beginPath();
                ctx.arc(gx, gy, gr, 0, Math.PI * 2);

            // Subtitle

            ctx.fillStyle = '#b0889b';
            ctx.fillText('in loving celebration of', 512, 570);

            // Name
            ctx.font = '500 96px "Cormorant Garamond"';
            ctx.fillStyle = '#9d6b7e';
            ctx.fillText('Olivia Marie', 512, 670);

            // Little subtitle
            ctx.font = 'italic 300 28px "Cormorant Garamond"';
            ctx.fillStyle = '#b0889b';
            ctx.fillText('awaited by Sarah & James', 512, 730);

            // Divider
            ctx.strokeStyle = '#c89b6c';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(220, 810);
            ctx.lineTo(420, 810);
            ctx.moveTo(604, 810);
            ctx.lineTo(824, 810);
            ctx.stroke();
            drawHeartCtx(ctx, 512, 810, 10, '#c89b6c');

            // Date
            ctx.font = '400 44px "Cormorant Garamond"';
            ctx.fillStyle = '#7a5462';
            ctx.fillText('Saturday, the 14th of June', 512, 900);
            ctx.font = 'italic 300 34px "Cormorant Garamond"';
            ctx.fillStyle = '#9d6b7e';
            ctx.fillText('at two o\'clock in the afternoon', 512, 955);

            // Location
            ctx.font = '400 40px "Cormorant Garamond"';
            ctx.fillStyle = '#7a5462';
            ctx.fillText('The Garden Terrace', 512, 1070);
            ctx.font = '300 26px "Cormorant Garamond"';
            ctx.fillStyle = '#9d6b7e';
            ctx.fillText('123 Blossom Lane · Rosewood', 512, 1115);

            // RSVP
            ctx.font = '300 30px "Cormorant Garamond"';
            ctx.fillStyle = '#b0889b';
            ctx.fillText('Kindly RSVP by the 1st of June', 512, 1245);
            ctx.font = 'italic 28px "Cormorant Garamond"';
            ctx.fillStyle = '#9d6b7e';
            ctx.fillText('Sarah · (555) 123·4567', 512, 1295);

            // Bottom decoration
            drawFlourishCtx(ctx, 512, 1370, 70, '#c89b6c');
            drawHeartCtx(ctx, 512, 1370, 14, '#c89b6c');

            ctx.font = 'italic 300 20px "Cormorant Garamond"';
            ctx.fillStyle = '#b0889b';
            ctx.fillText('a little one is on the way', 512, 1415);

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
        }

        // ---------- Card back texture ----------
        function createCardBackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1536;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 1024, 1536);
            grad.addColorStop(0, '#f5e1d0');
            grad.addColorStop(0.5, '#fde8f0');
            grad.addColorStop(1, '#e8d4c0');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1536);

            // Heart pattern
            for (let y = 60; y < 1536; y += 90) {
                for (let x = 60; x < 1024; x += 90) {
                    const offset = ((y - 60) / 90) % 2 === 0 ? 0 : 45;
                    drawHeartCtx(ctx, x + offset, y, 10, 'rgba(200, 155, 108, 0.22)');
                }
            }

            // Borders
            ctx.strokeStyle = '#c89b6c';
            ctx.lineWidth = 3;
            ctx.strokeRect(48, 48, 928, 1440);
            ctx.strokeStyle = 'rgba(200, 155, 108, 0.4)';
            ctx.lineWidth = 1;
            ctx.strokeRect(62, 62, 904, 1412);

            // Center medallion
            const cg = ctx.createRadialGradient(512, 768, 50, 512, 768, 280);
            cg.addColorStop(0, 'rgba(255, 251, 246, 0.95)');
            cg.addColorStop(1, 'rgba(255, 251, 246, 0)');
            ctx.fillStyle = cg;
            ctx.beginPath();
            ctx.arc(512, 768, 280, 0, Math.PI * 2);
            ctx.fill();

            // Monogram
            ctx.fillStyle = '#c89b6c';
            ctx.font = '240px "Parisienne"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('O', 512, 740);

            // Decorative ring
            ctx.strokeStyle = '#c89b6c';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(512, 768, 200, 0, Math.PI * 2);
            ctx.stroke();
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.arc(512, 768, 215, 0, Math.PI * 2);
            ctx.stroke();

            // Around the ring - small hearts
            for (let i = 0; i < 12; i++) {
                const a = (i / 12) * Math.PI * 2;
                const hx = 512 + Math.cos(a) * 215;
                const hy = 768 + Math.sin(a) * 215;
                drawHeartCtx(ctx, hx, hy, 8, '#c89b6c');
            }

            // Bottom text
            ctx.font = 'italic 300 28px "Cormorant Garamond"';
            ctx.fillStyle = '#9d6b7e';
            ctx.fillText('Olivia Marie', 512, 1050);
            ctx.font = '300 20px "Cormorant Garamond"';
            ctx.fillStyle = '#b0889b';
            ctx.fillText('— june mmxxv —', 512, 1090);

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
        }

        // ---------- 3D Heart shape ----------
        function createHeartShape() {
            const shape = new THREE.Shape();
            shape.moveTo(0, 1.2);
            shape.bezierCurveTo(0, 1.6, -0.6, 2.0, -1.2, 1.2);
            shape.bezierCurveTo(-2.0, 0.2, -1.6, -1.0, -0.6, -1.6);
            shape.bezierCurveTo(-0.3, -1.8, 0, -2.2, 0, -2.6);
            shape.bezierCurveTo(0, -2.2, 0.3, -1.8, 0.6, -1.6);
            shape.bezierCurveTo(1.6, -1.0, 2.0, 0.2, 1.2, 1.2);
            shape.bezierCurveTo(0.6, 2.0, 0, 1.6, 0, 1.2);
            return shape;
        }

        // ---------- Balloon ----------
        function createBalloon(colorHex) {
            const group = new THREE.Group();
            const baseColor = new THREE.Color(colorHex);

            // Balloon body
            const geo = new THREE.SphereGeometry(0.42, 32, 32);
            geo.scale(1, 1.28, 1);
            const mat = new THREE.MeshPhysicalMaterial({
                color: baseColor,
                roughness: 0.25,
                metalness: 0.05,
                clearcoat: 0.9,
                clearcoatRoughness: 0.15,
                sheen: 0.6,
                sheenColor: new THREE.Color(0xffffff),
                sheenRoughness: 0.3
            });
            const body = new THREE.Mesh(geo, mat);
            body.userData.isBalloonBody = true;
            group.add(body);

            // Highlight (small white sphere on top-left for shine)
            const hl = new THREE.Mesh(
                new THREE.SphereGeometry(0.09, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 })
            );
            hl.position.set(-0.15, 0.32, 0.18);
            group.add(hl);

            // Knot
            const knotGeo = new THREE.ConeGeometry(0.07, 0.16, 12);
            const knot = new THREE.Mesh(knotGeo, mat);
            knot.position.y = -0.58;
            knot.rotation.x = Math.PI;
            group.add(knot);

            // String (curved)
            const stringPoints = [];
            for (let i = 0; i <= 24; i++) {
                const t = i / 24;
                const wave = Math.sin(t * Math.PI * 1.5) * 0.08 * t;
                stringPoints.push(new THREE.Vector3(wave, -0.7 - t * 2.0, 0));
            }
            const stringGeo = new THREE.BufferGeometry().setFromPoints(stringPoints);
            const stringMat = new THREE.LineBasicMaterial({
                color: 0xc89b6c,
                transparent: true,
                opacity: 0.55
            });
            const string = new THREE.Line(stringGeo, stringMat);
            group.add(string);

            group.userData.body = body;
            return group;
        }

        // ---------- Cloud ----------
        function createCloud() {
            const group = new THREE.Group();
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                roughness: 1,
                metalness: 0,
                transparent: true,
                opacity: 0.88,
                transmission: 0.4,
                thickness: 1.5,
                clearcoat: 0,
                sheen: 0.3,
                sheenColor: new THREE.Color(0xffe4ee)
            });
            const count = 5 + Math.floor(Math.random() * 4);
            for (let i = 0; i < count; i++) {
                const r = 0.55 + Math.random() * 0.55;
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(r, 16, 16),
                    mat
                );
                sphere.position.set(
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 0.7,
                    (Math.random() - 0.5) * 0.8
                );
                group.add(sphere);
            }
            return group;
        }

        // ---------- Moon ----------
        function createMoon() {
            const group = new THREE.Group();

            const shape = new THREE.Shape();
            shape.absarc(0, 0, 1.1, 0, Math.PI * 2, false);
            const hole = new THREE.Path();
            hole.absarc(0.4, 0.05, 1.0, 0, Math.PI * 2, true);
            shape.holes.push(hole);

            const geo = new THREE.ShapeGeometry(shape, 64);
            const mat = new THREE.MeshBasicMaterial({
                color: 0xfff4d6,
                transparent: true,
                opacity: 0.92,
                side: THREE.DoubleSide
            });
            const moon = new THREE.Mesh(geo, mat);
            group.add(moon);

            // Glow halo
            const glowGeo = new THREE.CircleGeometry(2.2, 32);
            const glowMat = new THREE.ShaderMaterial({
                uniforms: { color: { value: new THREE.Color(0xfff4d6) } },
                vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
                fragmentShader: `
          uniform vec3 color;
          varying vec2 vUv;
          void main() {
            float d = distance(vUv, vec2(0.5));
            float a = smoothstep(0.5, 0.0, d) * 0.4;
            gl_FragColor = vec4(color, a);
          }
        `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.z = -0.1;
            group.add(glow);

            // Small stars around moon
            for (let i = 0; i < 5; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = 1.5 + Math.random() * 0.8;
                const star = new THREE.Mesh(
                    new THREE.CircleGeometry(0.04 + Math.random() * 0.04, 6),
                    new THREE.MeshBasicMaterial({ color: 0xfff4d6, transparent: true, opacity: 0.8 })
                );
                star.position.set(Math.cos(angle) * r, Math.sin(angle) * r, 0.05);
                star.userData = { twinkle: Math.random() * Math.PI * 2 };
                group.add(star);
            }

            return group;
        }

        // ---------- Init ----------
        function init() {
            const container = document.getElementById('canvas-container');
            const w = window.innerWidth;
            const h = window.innerHeight;

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0xfde8f0, 0.022);

            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
            camera.position.set(0.5, 0.8, 9.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.18;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.minDistance = 5;
            controls.maxDistance = 16;
            controls.maxPolarAngle = Math.PI * 0.68;
            controls.minPolarAngle = Math.PI * 0.22;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.45;
            controls.enablePan = false;

            // Lights
            const ambient = new THREE.AmbientLight(0xffeedd, 0.75);
            scene.add(ambient);

            const keyLight = new THREE.DirectionalLight(0xffe4b5, 1.3);
            keyLight.position.set(6, 9, 6);
            scene.add(keyLight);

            const fillLight = new THREE.PointLight(0xffb3c6, 1.0, 28);
            fillLight.position.set(-7, 2, 5);
            scene.add(fillLight);

            const backLight = new THREE.PointLight(0xb3d9ff, 0.7, 28);
            backLight.position.set(5, -2, -6);
            scene.add(backLight);

            const topLight = new THREE.PointLight(0xfff0a0, 0.5, 20);
            topLight.position.set(0, 8, 0);
            scene.add(topLight);

            // ---------- Background gradient sphere ----------
            const bgGeo = new THREE.SphereGeometry(40, 32, 32);
            const bgMat = new THREE.ShaderMaterial({
                uniforms: {
                    topColor: { value: new THREE.Color(0xe9c3d4) },
                    midColor: { value: new THREE.Color(0xfde8f0) },
                    botColor: { value: new THREE.Color(0xf0d9b8) }
                },
                vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
                fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 midColor;
          uniform vec3 botColor;
          varying vec3 vWorldPos;
          void main() {
            float h = normalize(vWorldPos).y;
            vec3 col;
            if (h > 0.0) {
              col = mix(midColor, topColor, smoothstep(0.0, 0.9, h));
            } else {
              col = mix(midColor, botColor, smoothstep(0.0, 0.9, -h));
            }
            gl_FragColor = vec4(col, 1.0);
          }
        `,
                side: THREE.BackSide,
                depthWrite: false
            });
            const bg = new THREE.Mesh(bgGeo, bgMat);
            scene.add(bg);

            // ---------- Card ----------
            cardGroup = new THREE.Group();

            const cardTexture = createCardTexture();
            const backTexture = createCardBackTexture();

            const edgeMat = new THREE.MeshPhysicalMaterial({
                color: 0xe8c4a0,
                roughness: 0.45,
                metalness: 0.15,
                clearcoat: 0.4
            });
            const frontMat = new THREE.MeshPhysicalMaterial({
                map: cardTexture,
                roughness: 0.55,
                metalness: 0.05,
                clearcoat: 0.5,
                clearcoatRoughness: 0.35
            });
            const backMat = new THREE.MeshPhysicalMaterial({
                map: backTexture,
                roughness: 0.55,
                metalness: 0.05,
                clearcoat: 0.5,
                clearcoatRoughness: 0.35
            });

            const cardGeo = new THREE.BoxGeometry(3.0, 4.5, 0.08);
            card = new THREE.Mesh(cardGeo, [edgeMat, edgeMat, edgeMat, edgeMat, frontMat, backMat]);
            cardGroup.add(card);

            // Glow behind card
            const glowGeo = new THREE.PlaneGeometry(5.5, 7);
            const glowMat = new THREE.ShaderMaterial({
                uniforms: {
                    color: { value: new THREE.Color(0xffd9e6) },
                    intensity: { value: 0.4 }
                },
                vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
                fragmentShader: `
          uniform vec3 color;
          uniform float intensity;
          varying vec2 vUv;
          void main() {
            vec2 c = vUv - 0.5;
            float d = length(c);
            float a = smoothstep(0.5, 0.05, d) * intensity;
            gl_FragColor = vec4(color, a);
          }
        `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            cardGlow = new THREE.Mesh(glowGeo, glowMat);
            cardGlow.position.z = -0.15;
            cardGroup.add(cardGlow);

            scene.add(cardGroup);

            // ---------- Balloons ----------
            const balloonCount = 7;
            for (let i = 0; i < balloonCount; i++) {
                const color = balloonPalette[i % balloonPalette.length];
                const balloon = createBalloon(color);
                const angle = (i / balloonCount) * Math.PI * 2 + Math.random() * 0.25;
                const radius = 3.9 + Math.random() * 0.7;
                const height = Math.sin(angle * 1.7) * 1.6 + 0.4;
                balloon.position.set(
                    Math.cos(angle) * radius,
                    height,
                    Math.sin(angle) * radius * 0.55
                );
                balloon.userData = {
                    basePos: balloon.position.clone(),
                    floatOffset: Math.random() * Math.PI * 2,
                    floatSpeed: 0.5 + Math.random() * 0.35,
                    color: color,
                    targetScale: 0,
                    popping: false,
                    respawnAt: 0
                };
                balloon.scale.set(0.001, 0.001, 0.001);
                balloons.push(balloon);
                scene.add(balloon);

                // Animate in
                setTimeout(() => {
                    balloon.userData.targetScale = 1;
                }, 400 + i * 180);
            }

            // ---------- Clouds ----------
            for (let i = 0; i < 7; i++) {
                const cloud = createCloud();
                const angle = (i / 7) * Math.PI * 2 + Math.random() * 0.5;
                const r = 9 + Math.random() * 5;
                cloud.position.set(
                    Math.cos(angle) * r,
                    Math.random() * 5 - 1.5,
                    Math.sin(angle) * r - 4
                );
                cloud.scale.setScalar(0.7 + Math.random() * 0.9);
                cloud.userData = {
                    driftOffset: Math.random() * Math.PI * 2,
                    driftSpeed: 0.1 + Math.random() * 0.15,
                    basePos: cloud.position.clone()
                };
                scene.add(cloud);
            }

            // ---------- Moon ----------
            const moon = createMoon();
            moon.position.set(-7.5, 5.2, -11);
            moon.scale.setScalar(1.4);
            scene.add(moon);

            // ---------- Stars ----------
            const starCount = 650;
            const starGeo = new THREE.BufferGeometry();
            const starPositions = new Float32Array(starCount * 3);
            const starSizes = new Float32Array(starCount);
            const starColors = new Float32Array(starCount * 3);
            const starPhases = new Float32Array(starCount);
            for (let i = 0; i < starCount; i++) {
                const r = 16 + Math.random() * 22;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                starPositions[i * 3 + 2] = r * Math.cos(phi);
                starSizes[i] = Math.random() * 0.18 + 0.04;
                starPhases[i] = Math.random() * Math.PI * 2;
                const tint = Math.random();
                if (tint < 0.65) {
                    starColors[i * 3] = 1; starColors[i * 3 + 1] = 0.98; starColors[i * 3 + 2] = 0.88;
                } else if (tint < 0.85) {
                    starColors[i * 3] = 1; starColors[i * 3 + 1] = 0.92; starColors[i * 3 + 2] = 0.82;
                } else {
                    starColors[i * 3] = 1; starColors[i * 3 + 1] = 0.85; starColors[i * 3 + 2] = 0.92;
                }
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
            starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
            starGeo.setAttribute('phase', new THREE.BufferAttribute(starPhases, 1));

            const starMat = new THREE.ShaderMaterial({
                uniforms: { time: { value: 0 } },
                vertexShader: `
          attribute float size;
          attribute vec3 color;
          attribute float phase;
          varying vec3 vColor;
          uniform float time;
          void main() {
            vColor = color;
            float twinkle = 0.5 + 0.5 * sin(time * 1.8 + phase * 4.0);
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = size * 130.0 * twinkle * (1.0 / -mv.z);
            gl_Position = projectionMatrix * mv;
          }
        `,
                fragmentShader: `
          varying vec3 vColor;
          void main() {
            vec2 c = gl_PointCoord - 0.5;
            float d = length(c);
            if (d > 0.5) discard;
            float a = 1.0 - smoothstep(0.0, 0.5, d);
            a = pow(a, 2.2);
            // cross flare
            float flare = max(0.0, 1.0 - abs(c.x) * 8.0) * max(0.0, 1.0 - abs(c.y) * 2.0);
            flare += max(0.0, 1.0 - abs(c.y) * 8.0) * max(0.0, 1.0 - abs(c.x) * 2.0);
            a += flare * 0.25;
            gl_FragColor = vec4(vColor, a);
          }
        `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            // ---------- Floating hearts ----------
            const heartShape = createHeartShape();
            const heartGeo = new THREE.ShapeGeometry(heartShape, 24);
            for (let i = 0; i < 14; i++) {
                const hue = 0.94 + Math.random() * 0.06;
                const heartMat = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(hue, 0.55, 0.72),
                    transparent: true,
                    opacity: 0.7,
                    side: THREE.DoubleSide
                });
                const heart = new THREE.Mesh(heartGeo, heartMat);
                const angle = Math.random() * Math.PI * 2;
                const r = 2.8 + Math.random() * 3.2;
                heart.position.set(
                    Math.cos(angle) * r,
                    Math.random() * 6 - 3,
                    Math.sin(angle) * r - 1
                );
                heart.scale.setScalar(0.08 + Math.random() * 0.14);
                heart.userData = {
                    basePos: heart.position.clone(),
                    floatOffset: Math.random() * Math.PI * 2,
                    floatSpeed: 0.3 + Math.random() * 0.4,
                    rotSpeed: (Math.random() - 0.5) * 0.6,
                    pulse: Math.random() * Math.PI * 2
                };
                hearts.push(heart);
                scene.add(heart);
            }

            // Pre-allocate confetti geometries
            heartConfettiGeo = new THREE.ShapeGeometry(createHeartShape(), 12);
            confettiPieceGeo = new THREE.PlaneGeometry(0.13, 0.18);

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2(-2, -2);

            clock = new THREE.Clock();

            // Events
            window.addEventListener('resize', onResize);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('click', onClick);
            renderer.domElement.addEventListener('touchstart', onTouch, { passive: true });

            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 500);

            animate();
        }

        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function onPointerMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onTouch(e) {
            if (e.touches.length > 0) {
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        }

        function onClick(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            // Check balloons first
            const balloonMeshes = [];
            balloons.forEach(b => {
                if (b.visible && !b.userData.popping && b.scale.x > 0.5) {
                    b.children.forEach(c => balloonMeshes.push(c));
                }
            });
            const balloonHits = raycaster.intersectObjects(balloonMeshes, false);
            if (balloonHits.length > 0) {
                let obj = balloonHits[0].object;
                while (obj.parent && obj.parent !== scene) obj = obj.parent;
                const balloon = balloons.find(b => b === obj);
                if (balloon) {
                    popBalloon(balloon);
                    return;
                }
            }

            // Check card
            const cardHits = raycaster.intersectObject(card, false);
            if (cardHits.length > 0) {
                celebrateCard();
            }
        }

        function popBalloon(balloon) {
            balloon.userData.popping = true;
            balloon.userData.targetScale = 0;

            const color = balloon.userData.color;
            const burstPos = balloon.position.clone();
            const localColors = [color, 0xffd700, 0xffffff, 0xffb3c6, 0xb3d9ff, 0xc89b6c];

            for (let i = 0; i < 42; i++) {
                const pieceColor = localColors[Math.floor(Math.random() * localColors.length)];
                const isHeart = Math.random() < 0.35;
                const piece = new THREE.Mesh(
                    isHeart ? heartConfettiGeo : confettiPieceGeo,
                    new THREE.MeshBasicMaterial({
                        color: pieceColor,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 1
                    })
                );
                piece.position.copy(burstPos);
                const angle = Math.random() * Math.PI * 2;
                const upSpeed = Math.random() * 0.09 + 0.04;
                const outSpeed = Math.random() * 0.07 + 0.02;
                piece.scale.setScalar(0.06 + Math.random() * 0.1);
                piece.userData = {
                    velocity: new THREE.Vector3(
                        Math.cos(angle) * outSpeed,
                        upSpeed,
                        Math.sin(angle) * outSpeed
                    ),
                    rotVel: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.35,
                        (Math.random() - 0.5) * 0.35,
                        (Math.random() - 0.5) * 0.35
                    ),
                    life: 1,
                    decay: 0.004 + Math.random() * 0.004
                };
                scene.add(piece);
                confetti.push(piece);
            }

            // Respawn after delay
            setTimeout(() => {
                balloon.userData.popping = false;
                balloon.userData.targetScale = 1;
                balloon.scale.set(0.001, 0.001, 0.001);
                const idx = balloons.indexOf(balloon);
                const angle = (idx / balloons.length) * Math.PI * 2 + Math.random() * 0.3;
                const radius = 3.9 + Math.random() * 0.7;
                const height = Math.sin(angle * 1.7) * 1.6 + 0.4;
                balloon.position.set(
                    Math.cos(angle) * radius,
                    height,
                    Math.sin(angle) * radius * 0.55
                );
                balloon.userData.basePos = balloon.position.clone();
            }, 4200);
        }

        function celebrateCard() {
            cardPulse = 1.0;
            controls.autoRotate = false;
            setTimeout(() => { controls.autoRotate = true; }, 4000);

            const burstPos = cardGroup.position.clone();
            burstPos.z += 0.1;

            for (let i = 0; i < 60; i++) {
                const pieceColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                const isHeart = Math.random() < 0.5;
                const piece = new THREE.Mesh(
                    isHeart ? heartConfettiGeo : confettiPieceGeo,
                    new THREE.MeshBasicMaterial({
                        color: pieceColor,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 1
                    })
                );
                piece.position.copy(burstPos);
                const angle = Math.random() * Math.PI * 2;
                const elev = Math.random() * 0.5 + 0.3;
                const speed = Math.random() * 0.08 + 0.04;
                piece.scale.setScalar(0.08 + Math.random() * 0.12);
                piece.userData = {
                    velocity: new THREE.Vector3(
                        Math.cos(angle) * speed,
                        elev * 0.12,
                        Math.sin(angle) * speed
                    ),
                    rotVel: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.4,
                        (Math.random() - 0.5) * 0.4,
                        (Math.random() - 0.5) * 0.4
                    ),
                    life: 1,
                    decay: 0.003 + Math.random() * 0.003
                };
                scene.add(piece);
                confetti.push(piece);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Card
            cardGroup.rotation.y = Math.sin(t * 0.32) * 0.42;
            cardGroup.rotation.z = Math.sin(t * 0.22) * 0.04;
            cardGroup.position.y = Math.sin(t * 0.5) * 0.16;

            // Card pulse on click
            if (cardPulse > 0) {
                cardPulse -= 0.012;
                const s = 1 + cardPulse * 0.08;
                card.scale.set(s, s, 1);
                cardGlow.material.uniforms.intensity.value = 0.4 + cardPulse * 0.8;
            } else {
                card.scale.set(1, 1, 1);
                cardGlow.material.uniforms.intensity.value = 0.35 + Math.sin(t * 0.8) * 0.08;
            }

            // Balloons
            balloons.forEach((b, i) => {
                const target = b.userData.targetScale;
                const current = b.scale.x;
                const ns = current + (target - current) * 0.12;
                b.scale.setScalar(Math.max(0.001, ns));

                if (b.userData.popping) return;

                const off = b.userData.floatOffset;
                b.position.y = b.userData.basePos.y + Math.sin(t * b.userData.floatSpeed + off) * 0.42;
                b.position.x = b.userData.basePos.x + Math.sin(t * b.userData.floatSpeed * 0.7 + off) * 0.22;
                b.rotation.z = Math.sin(t * 0.5 + off) * 0.16;
                b.rotation.x = Math.sin(t * 0.3 + off) * 0.1;
            });

            // Hover detection
            raycaster.setFromCamera(mouse, camera);
            const balloonMeshes = [];
            balloons.forEach(b => {
                if (b.visible && !b.userData.popping && b.scale.x > 0.5) {
                    b.children.forEach(c => balloonMeshes.push(c));
                }
            });
            const balloonHits = raycaster.intersectObjects(balloonMeshes, false);
            const cardHits = raycaster.intersectObject(card, false);

            if (balloonHits.length > 0) {
                document.body.style.cursor = 'pointer';
                // Hover scale
                balloons.forEach(b => {
                    if (b.userData.popping) return;
                    const isHovered = balloonHits[0].object === b.userData.body ||
                        b.children.includes(balloonHits[0].object);
                    const targetHover = isHovered ? 1.12 : 1.0;
                    const cur = b.userData.hoverScale || 1.0;
                    b.userData.hoverScale = cur + (targetHover - cur) * 0.12;
                    b.scale.setScalar(b.scale.x * 0 + b.userData.hoverScale * Math.max(0.001, b.userData.targetScale));
                });
            } else if (cardHits.length > 0) {
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }

            // Hearts
            hearts.forEach((h) => {
                h.position.y = h.userData.basePos.y + Math.sin(t * h.userData.floatSpeed + h.userData.floatOffset) * 0.55;
                h.position.x = h.userData.basePos.x + Math.cos(t * h.userData.floatSpeed * 0.5 + h.userData.floatOffset) * 0.3;
                h.position.z = h.userData.basePos.z + Math.sin(t * h.userData.floatSpeed * 0.4 + h.userData.floatOffset) * 0.2;
                h.rotation.z = t * h.userData.rotSpeed;
                const pulse = 1 + Math.sin(t * 1.5 + h.userData.pulse) * 0.15;
                h.scale.setScalar((0.08 + (h.userData.basePos.x * 0)) * pulse);
                h.material.opacity = 0.5 + Math.sin(t + h.userData.floatOffset) * 0.3;
            });

            // Stars
            stars.material.uniforms.time.value = t;
            stars.rotation.y = t * 0.018;

            // Confetti
            for (let i = confetti.length - 1; i >= 0; i--) {
                const p = confetti[i];
                p.userData.velocity.y -= 0.0035;
                p.userData.velocity.x *= 0.99;
                p.userData.velocity.z *= 0.99;
                p.position.add(p.userData.velocity);
                p.rotation.x += p.userData.rotVel.x;
                p.rotation.y += p.userData.rotVel.y;
                p.rotation.z += p.userData.rotVel.z;
                p.userData.life -= p.userData.decay;
                p.material.opacity = Math.max(0, p.userData.life);
                if (p.userData.life <= 0 || p.position.y < -8) {
                    scene.remove(p);
                    p.material.dispose();
                    confetti.splice(i, 1);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // ---------- Start ----------
        fontsReady.then(() => {
            init();
        }).catch(err => {
            console.warn('Font load issue, starting anyway:', err);
            init();
        });
    </script>
    <script>
        /* ==================================================================
           BLOOMYVITE EXTRAS — personalisation, share, shortcuts, chime
        ================================================================== */
        (function () {
            "use strict";

            var URLP = new URLSearchParams(location.search);
            var guestName = (URLP.get('to') || URLP.get('name') || URLP.get('guest') || '').trim().slice(0, 40);
            function cleanStr(s) { return String(s).replace(/[<>&"'`]/g, ''); }

            window.bwToastExt = function (msg, ms) {
                var t = document.getElementById('bw-toast');
                if (!t) return;
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(window.__bwT);
                window.__bwT = setTimeout(function () { t.classList.remove('show'); }, ms || 3400);
            };

            if (guestName) {
                var glEl = document.getElementById('guest-line');
                if (glEl) {
                    glEl.innerHTML = '🌸 Dear <b>' + cleanStr(guestName) + '</b> — a seat is saved for you';
                    glEl.classList.add('show');
                }
                document.title = 'Dear ' + cleanStr(guestName) + ' • A Baby Shower for Olivia Marie | Bloomyvite';
            }

            var shareBtn = document.getElementById('bw-share');
            if (shareBtn) {
                shareBtn.addEventListener('click', function () {
                    var base = location.origin + location.pathname;
                    var link = guestName ? (base + '?to=' + encodeURIComponent(guestName)) : base;
                    var txt = '🌸 You are invited! A Baby Shower for Olivia Marie — Saturday, the 14th of June, 2 PM, The Garden Terrace, 123 Blossom Lane, Rosewood.\n\n' + link + '\n\n✨ Invitation by Bloomyvite — https://bloomyvite.de5.net/';
                    if (navigator.share) {
                        navigator.share({ title: 'A Baby Shower for Olivia Marie', text: txt, url: link }).catch(function () { });
                    } else if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(txt).then(function () {
                            window.bwToastExt('🔗 Link copied — add ?to=Name to personalise');
                        }).catch(function () {
                            window.bwToastExt('🔗 ' + txt);
                        });
                    } else {
                        window.bwToastExt('🔗 ' + txt);
                    }
                });
            }

            document.addEventListener('keydown', function (e) {
                if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
                if (e.metaKey || e.ctrlKey || e.altKey) return;
                var k = e.key.toLowerCase();
                if (k === 's') { if (shareBtn) shareBtn.click(); }
                else if (k === '?' || k === 'h') {
                    window.bwToastExt('⌨️ Shortcut — S share the invitation');
                }
            });

            function chime(freq, dur, vol) {
                try {
                    var AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    var c = new AC();
                    var o = c.createOscillator(), g = c.createGain();
                    o.type = 'sine';
                    o.frequency.value = freq || 880;
                    g.gain.setValueAtTime(vol || .1, c.currentTime);
                    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + (dur || .6));
                    o.connect(g);
                    g.connect(c.destination);
                    o.start();
                    o.stop(c.currentTime + (dur || .6) + .1);
                } catch (err) { }
            }

            var wm = document.getElementById('bloomy-watermark');
            if (wm) {
                wm.addEventListener('click', function () { chime(1046, .6, .08); });
            }

            setTimeout(function () {
                if (guestName) {
                    window.bwToastExt('🌸 ' + cleanStr(guestName) + ', Sarah & James can\u2019t wait to celebrate with you');
                    chime(523.25, .4, .06);
                    setTimeout(function () { chime(659.25, .5, .06); }, 130);
                    setTimeout(function () { chime(783.99, .6, .05); }, 260);
                }
            }, 3400);
        })();
    </script>
